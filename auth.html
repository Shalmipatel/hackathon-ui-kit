<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in to Wanderbot</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        background: #fbfaf9;
        color: #1F2421;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 320px;
        width: 100%;
        text-align: center;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(36, 36, 36, 0.12);
        border-top-color: #242424;
        border-radius: 50%;
        margin: 0 auto 16px;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .title {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 4px;
      }
      .sub {
        font-size: 13px;
        color: rgba(36, 36, 36, 0.6);
      }
      .err {
        color: #b91c1c;
        font-size: 13px;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="spinner" id="spinner"></div>
      <div class="title" id="title">Signing you in…</div>
      <div class="sub" id="sub"></div>
      <div class="err" id="err"></div>
    </div>
    <script type="module" src="/src/auth-bridge.ts"></script>
  </body>
</html>
